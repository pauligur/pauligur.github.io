<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 200 240">
  <defs>
    <clipPath id="sh"><path d="M24 74 H176 V140 Q176 202 100 228 Q24 202 24 140 Z"/></clipPath>
    <radialGradient id="sun" cx="50%" cy="100%" r="80%"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f08c00"/></radialGradient>
  </defs>
  <!-- rising sun -->
  <g transform="translate(100 74)">
    <g fill="#f08c00">
      <polygon points="-6,0 0,-62 6,0"/><polygon points="-6,0 0,-62 6,0" transform="rotate(-20)"/><polygon points="-6,0 0,-62 6,0" transform="rotate(20)"/>
      <polygon points="-6,0 0,-58 6,0" transform="rotate(-40)"/><polygon points="-6,0 0,-58 6,0" transform="rotate(40)"/>
      <polygon points="-6,0 0,-54 6,0" transform="rotate(-60)"/><polygon points="-6,0 0,-54 6,0" transform="rotate(60)"/>
      <polygon points="-6,0 0,-50 6,0" transform="rotate(-80)"/><polygon points="-6,0 0,-50 6,0" transform="rotate(80)"/>
    </g>
    <g fill="#ffc933">
      <polygon points="-5,0 0,-48 5,0" transform="rotate(-10)"/><polygon points="-5,0 0,-48 5,0" transform="rotate(10)"/>
      <polygon points="-5,0 0,-44 5,0" transform="rotate(-30)"/><polygon points="-5,0 0,-44 5,0" transform="rotate(30)"/>
      <polygon points="-5,0 0,-40 5,0" transform="rotate(-50)"/><polygon points="-5,0 0,-40 5,0" transform="rotate(50)"/>
      <polygon points="-5,0 0,-36 5,0" transform="rotate(-70)"/><polygon points="-5,0 0,-36 5,0" transform="rotate(70)"/>
    </g>
    <path d="M-30 0 A30 30 0 0 1 30 0 Z" fill="url(#sun)"/>
  </g>
  <!-- shield: red | navy -->
  <g clip-path="url(#sh)">
    <rect x="0" y="60" width="100" height="180" fill="#c62f35"/>
    <rect x="100" y="60" width="100" height="180" fill="#1b2f6b"/>
  </g>
  <path d="M24 74 H176 V140 Q176 202 100 228 Q24 202 24 140 Z" fill="none" stroke="#e0b13a" stroke-width="9" stroke-linejoin="round"/>
  <!-- friendly lion -->
  <g transform="translate(100 134)">
    <g fill="#e0b13a" stroke="#8a5a00" stroke-width="2">
      <circle r="40"/>
      <circle cx="0" cy="-38" r="12"/><circle cx="27" cy="-27" r="12"/><circle cx="38" cy="0" r="12"/><circle cx="27" cy="27" r="12"/>
      <circle cx="0" cy="38" r="12"/><circle cx="-27" cy="27" r="12"/><circle cx="-38" cy="0" r="12"/><circle cx="-27" cy="-27" r="12"/>
    </g>
    <circle cx="-20" cy="-24" r="7" fill="#fff3d6" stroke="#8a5a00" stroke-width="2"/>
    <circle cx="20" cy="-24" r="7" fill="#fff3d6" stroke="#8a5a00" stroke-width="2"/>
    <ellipse rx="27" ry="25" fill="#fff3d6" stroke="#8a5a00" stroke-width="2"/>
    <ellipse cx="-10" cy="-5" rx="5" ry="6.5" fill="#1a1a2e"/><ellipse cx="10" cy="-5" rx="5" ry="6.5" fill="#1a1a2e"/>
    <circle cx="-8.5" cy="-7.5" r="1.8" fill="#fff"/><circle cx="11.5" cy="-7.5" r="1.8" fill="#fff"/>
    <path d="M-5 5 H5 L0 10 Z" fill="#c62f35"/>
    <path d="M-8 13 Q0 20 8 13" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-17" cy="8" r="4" fill="#ff8fa3" opacity=".6"/><circle cx="17" cy="8" r="4" fill="#ff8fa3" opacity=".6"/>
  </g>
  <!-- green ribbon -->
  <g>
    <path d="M8 196 L30 188 L30 222 L8 214 L16 205 Z" fill="#155c2e"/>
    <path d="M192 196 L170 188 L170 222 L192 214 L184 205 Z" fill="#155c2e"/>
    <path d="M26 186 Q100 170 174 186 L174 214 Q100 198 26 214 Z" fill="#1f7a3f" stroke="#e0b13a" stroke-width="3"/>
    <text x="100" y="206" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-weight="700" font-size="25" fill="#ffe27a" letter-spacing="6">TBS</text>
  </g>
</svg>
